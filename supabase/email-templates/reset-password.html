<!--
  Modelo "Reset password" do Supabase (Authentication > Emails > Templates).
  Assunto sugerido: Seu código para redefinir a senha do Tech News
  {{ .Token }} é o código de 6 dígitos que o app pede na tela "Digite o código".
-->
<div style="font-family: Arial, sans-serif; max-width: 480px; margin: 0 auto; padding: 24px; color: #1f1b2e;">
  <h2 style="margin: 0 0 12px;">Redefinir sua senha</h2>
  <p style="margin: 0 0 20px; line-height: 1.5;">
    Recebemos um pedido para redefinir a senha da sua conta no <strong>Tech News</strong>.
    Digite o código abaixo no app:
  </p>
  <p style="font-size: 32px; font-weight: bold; letter-spacing: 8px; text-align: center; background: #f1ecff; color: #6d4ae8; border-radius: 12px; padding: 16px; margin: 0 0 20px;">
    {{ .Token }}
  </p>
  <p style="margin: 0; line-height: 1.5; color: #6b6780; font-size: 14px;">
    O código vale por 1 hora. Se você não pediu isso, é só ignorar este e-mail: sua senha continua a mesma.
  </p>
</div>
