# Configuração do deploy do backend no Render (https://render.com).
# No painel do Render: New > Blueprint > escolher este repositório.
services:
  - type: web
    name: tech-news-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
