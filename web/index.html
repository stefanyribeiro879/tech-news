<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!--
    Substituído pelo valor de `--base-href` no `flutter build web`
    (no GitHub Pages: /tech-news/).
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Notícias de tecnologia dos temas que você escolher.">
  <meta name="theme-color" content="#2317FA">

  <!-- iPhone: "Adicionar à Tela de Início" abre em tela cheia, como um app. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Tech News">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Tech News</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Fundo enquanto o app carrega (mesma cor do tema claro). */
    html, body { margin: 0; background: #F4F6FB; }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
