# Publica uma versão nova do app Android.
# Disparo: push de uma tag "v<versão>", ex.: git tag -a v1.0.1 -m "Novidades" && git push origin v1.0.1
# Resultado: uma Release no GitHub com o APK. O app instalado encontra essa
# Release (lib/app_update.dart) e oferece a atualização ao usuário.
name: Release Android

on:
  push:
    tags: ['v*']

permissions:
  contents: write # necessário para criar a Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Conferir se a tag bate com a versão do pubspec.yaml
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PUBSPEC_VERSION="$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')"
          if [ "$TAG_VERSION" != "$PUBSPEC_VERSION" ]; then
            echo "::error::A tag é $GITHUB_REF_NAME, mas o pubspec.yaml está em $PUBSPEC_VERSION. Atualize o 'version:' antes de criar a tag."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Preparar chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Faltam os Secrets da chave de assinatura (veja o README)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/release.jks
          cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEYSTORE_PASSWORD
          EOF

      - run: flutter pub get

      - name: Gerar APK
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
        run: |
          # Com a variável SUPABASE_URL definida no GitHub, o app usa o proxy.
          EXTRA=""
          if [ -n "$SUPABASE_URL" ]; then EXTRA="--dart-define=SUPABASE_URL=$SUPABASE_URL"; fi
          flutter build apk --release $EXTRA
          mv build/app/outputs/flutter-apk/app-release.apk tech-news.apk

      - name: Ler a mensagem da tag (vira o texto "O que há de novo")
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > release-notes.txt

      - uses: softprops/action-gh-release@v2
        with:
          name: Tech News ${{ github.ref_name }}
          body_path: release-notes.txt
          files: tech-news.apk
