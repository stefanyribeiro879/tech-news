# Publica a versão web (usada no iPhone como app instalável) no GitHub Pages.
# Roda quando a main recebe um pacote novo — a main só recebe código pronto.
# (O Pages só aceita publicar a partir da main, por isso não roda na tag.)
name: Site (iPhone)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6   # mesma versão usada no desenvolvimento local
          cache: true

      - run: flutter pub get

      - name: Rodar os testes
        run: flutter test

      - name: Gerar o site
        run: flutter build web --release --base-href /tech-news/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - id: deploy
        uses: actions/deploy-pages@v4
