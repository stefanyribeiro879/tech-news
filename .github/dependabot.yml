# Avisa (com Pull Request) quando sai versão nova de uma dependência,
# principalmente correções de segurança.
version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
